---

- name: (Deprecation) Catch and report renamed element-web settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please rename the variable (`{{ item.old }}` -> `{{ item.new }}`) on your configuration file (vars.yml).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - {'old': 'matrix_client_element_showLabsSettings', 'new': 'matrix_client_element_show_lab_settings'}
    - {'old': 'matrix_client_element_permalinkPrefix', 'new': 'matrix_client_element_permalink_prefix'}
    - {'old': 'matrix_client_element_roomdir_servers', 'new': 'matrix_client_element_room_directory_servers'}
    - {'old': 'matrix_client_element_settingDefaults_custom_themes', 'new': 'matrix_client_element_setting_defaults_custom_themes'}
    - {'old': 'matrix_client_element_branding_authFooterLinks', 'new': 'matrix_client_element_branding_auth_footer_links'}
    - {'old': 'matrix_client_element_branding_authHeaderLogoUrl', 'new': 'matrix_client_element_branding_auth_header_logo_url'}
    - {'old': 'matrix_client_element_branding_welcomeBackgroundUrl', 'new': 'matrix_client_element_branding_welcome_background_url'}
    - {'old': 'matrix_client_element_jitsi_preferredDomain', 'new': 'matrix_client_element_jitsi_preferred_domain'}
    - {'old': 'matrix_client_element_welcome_user_id', 'new': '<removed>'}
    - {'old': 'matrix_client_element_docker_image_name_prefix', 'new': 'matrix_client_element_container_image_registry_prefix'}
    - {'old': 'matrix_client_element_docker_image', 'new': 'matrix_client_element_container_image'}
    - {'old': 'matrix_client_element_docker_image_force_pull', 'new': 'matrix_client_element_container_image_force_pull'}
    - {'old': 'matrix_client_element_docker_image_registry_prefix', 'new': 'matrix_client_element_container_image_registry_prefix'}
    - {'old': 'matrix_client_element_docker_image_registry_prefix_upstream', 'new': 'matrix_client_element_container_image_registry_prefix_upstream'}
    - {'old': 'matrix_client_element_docker_image_registry_prefix_upstream_default', 'new': 'matrix_client_element_container_image_registry_prefix_upstream_default'}
    - {'old': 'matrix_client_element_docker_src_files_path', 'new': 'matrix_client_element_container_src_files_path'}
    - {'old': 'matrix_client_element_container_image_force_pull', 'new': '<removed> (the new community.docker.docker_image_pull module handles this natively)'}
    - {'old': 'matrix_client_element_welcome_headline', 'new': '<removed> (Element Web now renders its own built-in welcome page and no longer loads the custom welcome.html this variable applied to; a logo and background can still be customized via matrix_client_element_branding_auth_header_logo_url and matrix_client_element_branding_welcome_background_url, and a fully custom page can be self-hosted and wired via embedded_pages.welcome_url in matrix_client_element_configuration_extension_json)'}
    - {'old': 'matrix_client_element_welcome_text', 'new': '<removed> (Element Web now renders its own built-in welcome page and no longer loads the custom welcome.html this variable applied to; see matrix_client_element_welcome_headline for alternatives)'}
    - {'old': 'matrix_client_element_welcome_logo_link', 'new': '<removed> (Element Web now renders its own built-in welcome page and no longer loads the custom welcome.html this variable applied to; see matrix_client_element_welcome_headline for alternatives)'}
    - {'old': 'matrix_client_element_page_template_welcome_path', 'new': '<removed> (Element Web now renders its own built-in welcome page; a fully custom page can be self-hosted and wired via embedded_pages.welcome_url in matrix_client_element_configuration_extension_json)'}

- name: Fail if required Element Web settings not defined
  ansible.builtin.fail:
    msg: >
      You need to define a required configuration setting (`{{ item }}`) for using Element Web.
  when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
  with_items:
    - {'name': 'matrix_client_element_default_hs_url', when: true}
    - {'name': 'matrix_client_element_container_network', when: true}
    - {'name': 'matrix_client_element_container_labels_traefik_compression_middleware_name', when: "{{ matrix_client_element_container_labels_traefik_compression_middleware_enabled }}"}

- name: Fail if Element location sharing enabled, but no tile server defined
  ansible.builtin.fail:
    msg: >-
      You need to define at least one map tile server in matrix_client_element_location_sharing_map_style_content_sources_localsource_tiles list
  when:
    - matrix_client_element_location_sharing_enabled | bool
    - matrix_client_element_location_sharing_map_style_content_sources_localsource_tiles | length == 0

- name: Fail if an Element Web module is misconfigured
  ansible.builtin.fail:
    msg: >-
      Each entry in matrix_client_element_modules needs a `name` (lowercase letters, digits, `.`, `_` and `-`)
      and exactly one of `src` (the absolute path of a directory on the Ansible controller)
      or `url` (a path on Element Web's own host, starting with `/`).
      `entry` must be a relative path without `..`, and `config` a dictionary.
      This entry is invalid: {{ item }}
  loop: "{{ matrix_client_element_modules }}"
  when: >-
    item is not mapping
    or item.name is not defined
    or item.name is not string
    or item.name is not match('^[a-z0-9][a-z0-9._-]*$')
    or (item.src is defined) == (item.url is defined)
    or (item.src is defined and (item.src is not string or item.src is not abs))
    or (item.url is defined and (item.url is not string or item.url is not match('^/[^/]')))
    or (item.entry is defined and (item.entry is not string or item.entry is not match('^[A-Za-z0-9_-][A-Za-z0-9._/-]*$') or '..' in item.entry.split('/')))
    or (item.config is defined and item.config is not mapping)

- name: Fail if an Element Web module's files are missing
  ansible.builtin.fail:
    msg: >-
      Element Web module `{{ item.name }}`: `{{ item.src }}/{{ item.entry | default('index.js') }}` does not exist on the Ansible controller.
      Point `src` at the directory holding the built module, or set `entry` to the file Element Web should load.
  loop: "{{ matrix_client_element_modules | selectattr('src', 'defined') }}"
  loop_control:
    label: "{{ item.name }}"
  when: "(item.src ~ '/' ~ item.entry | default('index.js')) is not file"

- name: Fail if matrix_client_element_modules_url_path is invalid
  ansible.builtin.fail:
    msg: >-
      matrix_client_element_modules_url_path (`{{ matrix_client_element_modules_url_path }}`) must be a single path segment
      (lowercase letters, digits, `.`, `_` and `-`) that doesn't start with `modules` or `config`,
      because the Element Web image's nginx serves those paths from elsewhere.
  when:
    - matrix_client_element_modules_local | length > 0
    - matrix_client_element_modules_url_path is not match('^[a-z0-9][a-z0-9._-]*$') or matrix_client_element_modules_url_path is match('^(modules|config)')

- name: Fail if Element Web module names are not unique
  ansible.builtin.fail:
    msg: >-
      Each entry in matrix_client_element_modules needs a unique `name`.
      Configured names: {{ matrix_client_element_modules | map(attribute='name') | join(', ') }}
  when: "(matrix_client_element_modules | map(attribute='name') | unique | length) != (matrix_client_element_modules | length)"

- name: (Deprecation) Catch and report riot-web variables
  ansible.builtin.fail:
    msg: >-
      Riot has been renamed to Element (https://element.io/blog/welcome-to-element/).
      The playbook will migrate your existing configuration and data automatically, but you need to adjust variable names.
      Please rename these variable (`matrix_riot_web_*` -> `matrix_client_element_*`) on your configuration file (vars.yml): {{ lookup('ansible.builtin.varnames', '^matrix_riot_web_.+', wantlist=True) | join(', ') }}
      Also note that DNS configuration changes may be necessary.
  when: "lookup('ansible.builtin.varnames', '^matrix_riot_web_.+', wantlist=True) | length > 0"

- when: matrix_client_element_container_labels_traefik_enabled | bool
  block:
    - name: Fail if required matrix-client-element Traefik settings not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - matrix_client_element_container_labels_traefik_hostname
        - matrix_client_element_container_labels_traefik_path_prefix

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `matrix_client_element_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if matrix_client_element_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          matrix_client_element_container_labels_traefik_path_prefix (`{{ matrix_client_element_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/element`).
      when: "matrix_client_element_container_labels_traefik_path_prefix != '/' and matrix_client_element_container_labels_traefik_path_prefix[-1] == '/'"
